# Builds the image and publishes it to this project's container registry.
# Runs on the bolha dind runners (bravo-open-*, untagged jobs).
# Tags: <version>-<pipeline id> (immutable, pin this one in k8s) and latest.
stages: [test, build]

variables:
  JUSTMYTOOTS_VERSION: "0.1.3"

test:
  stage: test
  image: golang:1.26-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - go vet ./...
    - go test ./...

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -q -t "$CI_REGISTRY_IMAGE:$JUSTMYTOOTS_VERSION-$CI_PIPELINE_ID" .
    - docker tag "$CI_REGISTRY_IMAGE:$JUSTMYTOOTS_VERSION-$CI_PIPELINE_ID" "$CI_REGISTRY_IMAGE:latest"
    - docker push -q "$CI_REGISTRY_IMAGE:$JUSTMYTOOTS_VERSION-$CI_PIPELINE_ID"
    - docker push -q "$CI_REGISTRY_IMAGE:latest"
    - echo "published $CI_REGISTRY_IMAGE:$JUSTMYTOOTS_VERSION-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
