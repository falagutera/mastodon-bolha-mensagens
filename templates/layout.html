{{define "head"}}<!doctype html>
<html lang="{{.T.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{.T.title}} · {{.Domain}}</title>
<link rel="stylesheet" href="/assets/artefatos.css">
<link rel="stylesheet" href="/assets/toots.css">
</head>
<body>
<div class="page">
<div class="topbar">
  <a class="eyebrow home" href="/">{{.T.brand}} · {{.Domain}}</a>
  <span class="langsel" role="group" aria-label="{{.T.language}}">
    <a href="/?lang=pt" hreflang="pt-BR"{{if eq .T.lang "pt-BR"}} class="on" aria-current="true"{{end}}>PT</a>
    <a href="/?lang=en" hreflang="en"{{if eq .T.lang "en"}} class="on" aria-current="true"{{end}}>EN</a>
  </span>
</div>
{{end}}
{{define "foot"}}<footer class="foot">
  <a href="https://gitlab.gutocarvalho.net/open/bolha/justmytoots">{{.T.source}}</a>
  <a href="https://github.com/cookiemumbles/justmytoots.com">{{.T.credit}}</a>
  <a class="version" href="https://gitlab.gutocarvalho.net/open/bolha/justmytoots/container_registry">justmytoots {{.Version}}</a>
</footer>
</div>
</body>
</html>
{{end}}
