# Builds the image and publishes it to the images group (registry.gutocarvalho.net/images/justmytoots).
# Runs on the bolha dind runners (bravo-open-*, untagged jobs).
# The version is in the VERSION file. Tags: X.Y.Z-BUILD (immutable, pin this one in k8s), X.Y.Z and latest.
include:
  - project: 'open/gcn/ci-templates'
    file: '/security.yml'
    ref: main
stages: [security, test, build]

test:
  stage: test
  image: golang:1.26-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)"
    - go test -p 1 ./...
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - "$(go env GOPATH)/bin/govulncheck ./..."

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$IMAGES_REGISTRY_PASSWORD" | docker login -u "$IMAGES_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - V="$(cat VERSION)"
    - docker build --pull -q --build-arg "BUILD=$CI_PIPELINE_ID" -t "registry.gutocarvalho.net/images/justmytoots:$V-$CI_PIPELINE_ID" .
    - for t in "$V" latest; do docker tag "registry.gutocarvalho.net/images/justmytoots:$V-$CI_PIPELINE_ID" "registry.gutocarvalho.net/images/justmytoots:$t"; done
    - for t in "$V-$CI_PIPELINE_ID" "$V" latest; do docker push -q "registry.gutocarvalho.net/images/justmytoots:$t"; done
    - echo "published registry.gutocarvalho.net/images/justmytoots:$V-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
