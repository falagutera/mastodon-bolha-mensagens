{{define "head"}}<!doctype html>
<html lang="{{.T.lang}}" data-family="bolha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{.T.title}} · {{.Domain}}</title>
<link rel="stylesheet" href="/assets/style.css?v={{.Version}}">
<link rel="stylesheet" href="/assets/toots.css?v={{.Version}}">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="/"><span class="bubble"></span>{{.T.brand}}</a>
  <span class="toplinks">
    <a class="toggle" href="/release-notes"{{if .Notes}} aria-current="page"{{end}}>{{.T.nav_notes}}</a>
    <span class="langsel" role="group" aria-label="{{.T.language}}">
      <a href="/?lang=pt" hreflang="pt-BR"{{if eq .T.lang "pt-BR"}} aria-current="true"{{end}}>PT</a>·<a href="/?lang=en" hreflang="en"{{if eq .T.lang "en"}} aria-current="true"{{end}}>EN</a>
    </span>
  </span>
</header>
{{end}}
{{define "foot"}}<footer><a href="/release-notes">justmytoots {{.Version}}</a> · <a href="https://gitlab.gutocarvalho.net/open/bolha/justmytoots">{{.T.source}}</a> · {{.T.part_of}} <a href="https://bolha.io">bolha.io</a> · <a href="https://github.com/cookiemumbles/justmytoots.com">{{.T.credit}}</a></footer>
</div>
</body>
</html>
{{end}}
